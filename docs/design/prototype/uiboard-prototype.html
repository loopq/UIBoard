<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UIBoard Prototype</title>
<style>
:root{
  --canvas:#ECECEC;--panel:#F6F6F6;--toolbar:#F3F3F3;--window:#FFFFFF;
  --sep:rgba(0,0,0,.10);--text:#1D1D1F;--text2:#6E6E73;--text3:#A1A1A6;
  --field:#FFFFFF;--card:#FFFFFF;--ctl:rgba(0,0,0,.05);
  --accent:#0A84FF;--selbg:rgba(10,132,255,.08);--menu:rgba(250,250,250,.98);
  --shot:rgba(0,0,0,.14);--dim:rgba(0,0,0,.18);
}
.dark{
  --canvas:#1E1E1E;--panel:#262626;--toolbar:#2B2B2B;--window:#232323;
  --sep:rgba(255,255,255,.10);--text:#F5F5F7;--text2:#A1A1A6;--text3:#6E6E73;
  --field:#1E1E1E;--card:#2F2F2F;--ctl:rgba(255,255,255,.08);
  --selbg:rgba(10,132,255,.18);--menu:rgba(44,44,46,.98);
  --shot:rgba(255,255,255,.14);--dim:rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;font-size:13px;color:var(--text);background:var(--window);-webkit-font-smoothing:antialiased}
.win{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--window)}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 14px 0 20px;background:var(--toolbar);border-bottom:1px solid var(--sep)}
.lights{display:flex;gap:8px;margin-right:22px}
.lights i{display:block;width:12px;height:12px;border-radius:50%}
.title{position:absolute;left:0;right:0;text-align:center;font-weight:600;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;background:var(--ctl);font-weight:500}
.chip .dot{width:6px;height:6px;border-radius:50%;background:#34C759}
.tb{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;color:var(--text);font-weight:500}
.tb svg{color:var(--text2)}
.spacer{flex:1}
.primary{display:flex;align-items:center;gap:6px;height:28px;padding:0 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600}
.primary.off{background:var(--ctl);color:var(--text3)}
.body{flex:1;display:flex;min-height:0}
.canvas{flex:1;display:flex;align-items:center;justify-content:center;background:var(--canvas)}
.shot{display:block;outline:1px solid var(--shot)}
.insp{width:340px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--sep)}
.ih{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.ih b{font-size:13px}
.pill{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--ctl);color:var(--text2);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 12px}
.card{position:relative;display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--sep)}
.card.sel{background:var(--selbg);border-color:var(--accent)}
.badge{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.note{flex:1;line-height:1.5;padding-right:14px;min-height:40px}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--accent);vertical-align:-3px;margin-left:1px}
.x{position:absolute;top:10px;right:10px;color:var(--text3)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);font-size:12px}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;border-top:1px solid var(--sep)}
.sh span{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.refs{display:flex;gap:8px;padding:0 16px 14px}
.ref{position:relative;width:64px;height:142px;border-radius:6px;overflow:hidden;outline:1px solid var(--sep)}
.add{width:64px;height:142px;border-radius:6px;border:1.5px dashed var(--text3);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.fig{display:flex;align-items:center;gap:8px;margin:0 16px 16px;height:30px;padding:0 10px;border-radius:7px;background:var(--field);border:1px solid var(--sep);color:var(--text);white-space:nowrap;overflow:hidden}
.fig .t{overflow:hidden;text-overflow:ellipsis}
.fig .ph{color:var(--text3)}
.drop{width:440px;height:560px;border-radius:18px;border:2px dashed var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text2)}
.drop h2{font-size:17px;font-weight:600;color:var(--text)}
.drop p{display:flex;align-items:center;gap:6px}
kbd{font-family:inherit;font-size:12px;padding:1px 6px;border-radius:5px;background:var(--ctl);border:1px solid var(--sep);color:var(--text)}
.menu{position:absolute;width:268px;padding:5px;border-radius:9px;background:var(--menu);border:.5px solid var(--sep);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mi{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;min-height:24px}
.mi .ck{width:14px;flex:none;font-weight:600}
.mi .sub{font-size:11px;color:var(--text2);font-family:"SF Mono",Menlo,monospace}
.mi .r{margin-left:auto;color:var(--text2);font-size:12px;display:flex;align-items:center;gap:4px}
.mi.dis{color:var(--text3)}
.mi.dis .sub{color:var(--text3)}
.msep{height:1px;margin:5px 8px;background:var(--sep)}
.dim{position:absolute;left:0;right:0;bottom:0;background:var(--dim)}
.sheet{position:absolute;top:52px;left:calc(50% - 220px);width:440px;padding:22px 24px 20px;border-radius:0 0 12px 12px;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet h3{font-size:15px;margin:10px 0 12px}
.path{font-family:"SF Mono",Menlo,monospace;font-size:12px;padding:8px 10px;border-radius:6px;background:var(--field);border:1px solid var(--sep);user-select:text}
.btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{height:28px;padding:0 14px;border-radius:7px;display:flex;align-items:center;font-weight:500;background:var(--card);border:1px solid var(--sep)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.alert{position:absolute;top:calc(50% - 130px);left:calc(50% - 140px);width:280px;padding:20px 16px 16px;border-radius:12px;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}
.alert h4{font-size:13px;margin:12px 0 6px}
.alert p{font-size:11px;color:var(--text2)}
.alert .btns{justify-content:stretch;margin-top:16px}
.alert .btn{flex:1;justify-content:center}
.alert .red{color:#FF3B30;font-weight:600}
.hist{flex:1;padding:18px 28px;overflow:hidden}
.day{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.day b{font-size:13px}
.grid{display:flex;gap:22px;margin-bottom:26px}
.hc{position:relative;width:120px}
.hc .th{width:120px;height:266px;border-radius:6px;overflow:hidden;outline:1px solid var(--sep)}
.hc.hover .th{outline:2px solid var(--accent)}
.hc .tm{margin-top:7px;text-align:center;color:var(--text2);font-size:12px;font-variant-numeric:tabular-nums}
.hb{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.hb i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#1D1D1F}
.form{margin:22px 24px 10px;border-radius:10px;background:var(--card);border:1px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row+.row{border-top:1px solid var(--sep)}
.row .k{width:84px;font-weight:500}
.row .v{flex:1;min-width:0;font-family:"SF Mono",Menlo,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v.gray{color:var(--text2)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(52,199,89,.15);color:#248A3D;white-space:nowrap}
.foot{margin:0 26px;font-size:11px;color:var(--text2)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const PAL=['#FF3B30','#0A84FF','#AF52DE','#FF9500','#34C759','#FF2D55'];

const ICONS={
  iphone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  chevron:'<path d="M7 10l5 5 5-5"/>',
  capture:'<path d="M3 8V5.5A2.5 2.5 0 015.5 3H8M16 3h2.5A2.5 2.5 0 0121 5.5V8M21 16v2.5a2.5 2.5 0 01-2.5 2.5H16M8 21H5.5A2.5 2.5 0 013 18.5V16"/><rect x="7" y="8.5" width="10" height="7.5" rx="1.5"/><circle cx="12" cy="12.25" r="2"/>',
  import:'<path d="M12 3v11M8 10l4 4 4-4M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  export:'<path d="M12 15V3M8 7l4-4 4 4M6 10H5a1 1 0 00-1 1v9a1 1 0 001 1h14a1 1 0 001-1v-9a1 1 0 00-1-1h-1"/>',
  link:'<path d="M10 14a4 4 0 005.66 0l3-3a4 4 0 00-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 00-5.66 0l-3 3a4 4 0 005.66 5.66l1-1"/>',
  x:'<path d="M7 7l10 10M17 7L7 17"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  doc:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2h2"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  warn:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
  photo:'<rect x="2.5" y="4" width="19" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21.5 16l-5.5-5.5L6 20.5"/>',
  click:'<path d="M9 3v3M3 9h3M4.8 4.8l2 2M14 9l-4.5 12.5 3-4.5 5 5 2-2-5-5 4.5-3z"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>'
};
function ic(n,s=16,w=1.7){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`}

function screen(o){
  const g=[];
  g.push('<rect width="1080" height="2400" fill="#F7F5FF"/>');
  g.push('<text x="60" y="62" font-size="34" font-weight="600" fill="#1D1D1F">9:41</text>');
  g.push('<rect x="870" y="36" width="10" height="26" rx="2" fill="#1D1D1F"/><rect x="886" y="30" width="10" height="32" rx="2" fill="#1D1D1F"/><rect x="920" y="34" width="66" height="30" rx="8" fill="none" stroke="#1D1D1F" stroke-width="3"/><rect x="925" y="39" width="46" height="20" rx="4" fill="#1D1D1F"/>');
  const ax=130,ay=195;
  g.push(`<circle cx="${ax}" cy="${ay}" r="70" fill="#FFC2D4"/><circle cx="${ax}" cy="${ay-14}" r="28" fill="#FFF1F5"/><path d="M${ax-46} ${ay+54} Q${ax} ${ay+6} ${ax+46} ${ay+54} Z" fill="#FFF1F5"/>`);
  const tx=ax+70+o.gap;
  g.push(`<text x="${tx}" y="186" font-size="52" font-weight="700" fill="#1D1D1F">Neku Studio</text><text x="${tx}" y="238" font-size="32" fill="#8E8E93">12.4k followers</text>`);
  g.push('<circle cx="985" cy="195" r="46" fill="#EDE8FF"/><path d="M968 212h34M972 212v-22a13 13 0 0126 0v22M980 222a5 5 0 0010 0" fill="none" stroke="#7B5CFF" stroke-width="5" stroke-linecap="round"/>');
  g.push('<rect x="60" y="350" width="960" height="100" rx="50" fill="#7B5CFF"/>');
  const ty=o.tabTall?334:356,th=o.tabTall?132:88,sx=o.bonus?540:66;
  g.push(`<rect x="${sx}" y="${ty}" width="474" height="${th}" rx="${th/2}" fill="#FFD43B"/>`);
  g.push(`<text x="303" y="412" font-size="36" font-weight="700" fill="${o.bonus?'#FFFFFF':'#4A3500'}" text-anchor="middle">Rewards</text><text x="777" y="412" font-size="36" font-weight="700" fill="${o.bonus?'#4A3500':'#FFFFFF'}" text-anchor="middle">Bonus</text>`);
  const pastel=['#FFE3EC','#E3F0FF','#E6F9E8','#FFF3D6','#EDE3FF','#DDF6F3'];
  const titles=['Summer Look','Street Style','Cozy Knit','Beach Day','Night Out','School Fit'];
  const likes=['2.1k','864','1.3k','527','3.8k','942'];
  for(let i=0;i<6;i++){
    const x=60+(i%2)*495,y=510+Math.floor(i/2)*555;
    g.push(`<rect x="${x}" y="${y}" width="465" height="520" rx="32" fill="#FFFFFF"/><rect x="${x}" y="${y}" width="465" height="380" rx="32" fill="${pastel[i]}"/><rect x="${x}" y="${y+340}" width="465" height="40" fill="${pastel[i]}"/>`);
    g.push(`<circle cx="${x+232}" cy="${y+165}" r="70" fill="#FFFFFF" opacity=".75"/><path d="M${x+122} ${y+380} Q${x+232} ${y+230} ${x+342} ${y+380} Z" fill="#FFFFFF" opacity=".75"/>`);
    g.push(`<text x="${x+28}" y="${y+444}" font-size="34" font-weight="700" fill="#1D1D1F">${titles[i]}</text><text x="${x+28}" y="${y+494}" font-size="28" fill="#8E8E93">♥ ${likes[i]}</text>`);
  }
  g.push('<rect y="2180" width="1080" height="220" fill="#FFFFFF"/><rect y="2180" width="1080" height="2" fill="#ECEAF5"/>');
  const nav=['<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>','<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>','<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'];
  const labels=['Home','Explore','Create','Me'];
  [135,405,675,945].forEach((cx,i)=>{
    const s=(i===2&&o.iconBig)?100:60,c=i===0?'#7B5CFF':'#8E8E93';
    g.push(`<g transform="translate(${cx-s/2} ${2266-s/2}) scale(${s/24})" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${nav[i]}</g>`);
    g.push(`<text x="${cx}" y="2352" font-size="26" fill="${c}" text-anchor="middle">${labels[i]}</text>`);
  });
  g.push('<rect x="420" y="2374" width="240" height="10" rx="5" fill="#1D1D1F" opacity=".85"/>');
  return g.join('');
}

function marks(list,sel){
  const W=1080,H=2400,s=Math.max(3,Math.round(W*.004)),d=Math.round(W*.05),rp=Math.round(W*.012),off=.05*W;
  const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  let L='',S='',B='';
  list.forEach((m,i)=>{
    const c=PAL[i%PAL.length],sw=i===sel?2*s:s;
    let bx,by;
    if(m.w===0&&m.h===0){
      bx=cl(m.x+off,d/2,W-d/2);by=cl(m.y-off,d/2,H-d/2);
      const len=Math.hypot(bx-m.x,by-m.y),ux=(bx-m.x)/len,uy=(by-m.y)/len;
      L+=`<line x1="${m.x+ux*rp}" y1="${m.y+uy*rp}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${sw}"/>`;
      S+=`<circle cx="${m.x}" cy="${m.y}" r="${rp}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
    }else{
      bx=cl(m.x,d/2,W-d/2);by=cl(m.y,d/2,H-d/2);
      S+=`<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
    }
    B+=`<circle cx="${bx}" cy="${by}" r="${d/2}" fill="${c}" stroke="#FFFFFF" stroke-width="${s}"/><text x="${bx}" y="${by}" dominant-baseline="central" text-anchor="middle" font-size="${Math.round(d*.6)}" font-weight="700" fill="#FFFFFF">${i+1}</text>`;
  });
  return L+S+B;
}

function shot(o,list,sel,w,cls='shot'){
  return `<svg class="${cls}" viewBox="0 0 1080 2400" width="${w}" height="${Math.round(w*2400/1080)}" font-family="-apple-system,sans-serif">${screen(o)}${list?marks(list,sel):''}</svg>`;
}

const BUG={gap:150,tabTall:false,iconBig:true};
const FIX={gap:40,tabTall:true,iconBig:false};
const MB=[{x:40,y:105,w:620,h:180},{x:50,y:322,w:980,h:156},{x:675,y:2266,w:0,h:0}];
const NOTES=['头像和标题之间的留白明显偏大，以设计稿为准。','黄色选中态应该比紫色底更高，现在两者一样高。','这个 icon 比设计稿明显偏大。'];

function lights(){return '<div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>'}

function toolbar(exportOn){
  return `<div class="bar">${lights()}
    <div class="chip">${ic('iphone',15)}<span>Pixel 7</span><span class="dot"></span>${ic('chevron',12,2)}</div>
    <div class="tb">${ic('capture')}<span>Capture</span></div>
    <div class="tb">${ic('import')}<span>Import</span></div>
    <div class="spacer"></div>
    <div class="tb">${ic('clock')}<span>History</span></div>
    <div class="primary ${exportOn?'':'off'}">${ic('export',15,1.9)}<span>Export</span></div>
  </div>`;
}

function inspector(working){
  const cards=working?`<div class="cards">${NOTES.map((n,i)=>`<div class="card ${i===1?'sel':''}"><div class="badge" style="background:${PAL[i]}">${i+1}</div><div class="note">${n}${i===1?'<span class="caret"></span>':''}</div>${i===1?`<div class="x">${ic('x',14,2)}</div>`:''}</div>`).join('')}</div>`
    :`<div class="empty">${ic('click',28,1.5)}<span>Click to pin · Drag to frame</span></div>`;
  const refs=working?`<div class="ref">${shot(FIX,null,null,64,'')}</div><div class="ref">${shot({...FIX,bonus:true},null,null,64,'')}</div>`:'';
  const fig=working?`<div class="fig">${ic('link',14)}<span class="t">figma.com/design/pw7H7us12aHi2IqHDi0bdm/Neku?node-id=128-22976</span></div>`
    :`<div class="fig">${ic('link',14)}<span class="ph">Figma URL</span></div>`;
  return `<aside class="insp">
    <div class="ih"><b>Issues</b><span class="pill">${working?3:0}</span></div>
    ${cards}
    <div class="sh"><span>References</span><span class="pill">${working?2:0}</span></div>
    <div class="refs">${refs}<div class="add">${ic('plus',18,1.8)}</div></div>
    ${fig}
  </aside>`;
}

function editor(working,overlay=''){
  const canvas=working?shot(BUG,MB,1,324):`<div class="drop">${ic('photo',56,1.3)}<h2>Drop a screenshot</h2><p><kbd>⌘V</kbd> to paste</p><p><kbd>⌘⇧A</kbd> to capture from device</p></div>`;
  return `<div class="win">${toolbar(working)}<div class="body"><div class="canvas">${canvas}</div>${inspector(working)}</div>${overlay}</div>`;
}

function menu(){
  return `<div class="menu" style="left:88px;top:46px">
    <div class="mi"><span class="ck">✓</span><div><div>Pixel 7</div><div class="sub">37091JEHN</div></div></div>
    <div class="mi"><span class="ck"></span><div><div>Android Emulator</div><div class="sub">emulator-5554</div></div></div>
    <div class="mi dis"><span class="ck"></span><div><div>Galaxy S23</div><div class="sub">R5CW30ABCDE</div></div><span class="r" style="color:#C98A00">${ic('warn',13,1.8)}unauthorized</span></div>
    <div class="msep"></div>
    <div class="mi"><span class="ck"></span><span style="display:flex;align-items:center;gap:6px">${ic('refresh',14)}Refresh</span><span class="r">⌘R</span></div>
  </div>`;
}

function sheet(){
  return `<div class="dim" style="top:52px"></div><div class="sheet">
    <svg width="36" height="36" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#34C759"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h3>Exported</h3>
    <div class="path">~/UIReview/2026-09-24/18-15-42</div>
    <div class="btns"><div class="btn">${'Reveal in Finder'}</div><div class="btn blue">Copy Path</div></div>
  </div>`;
}

function appIcon(){
  return `<svg width="56" height="56" viewBox="0 0 56 56"><rect width="56" height="56" rx="13" fill="#0A84FF"/><rect x="15" y="17" width="28" height="24" rx="3" fill="none" stroke="#fff" stroke-width="3"/><circle cx="15" cy="17" r="8" fill="#FF3B30" stroke="#fff" stroke-width="2.5"/><text x="15" y="17" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="-apple-system">1</text></svg>`;
}

function alertBox(){
  return `<div class="dim" style="top:0"></div><div class="alert">${appIcon()}
    <h4>Replace screenshot?</h4><p>This will clear 3 annotations.</p>
    <div class="btns"><div class="btn">Cancel</div><div class="btn red">Replace</div></div>
  </div>`;
}

function history(){
  const days=[
    ['2026-09-24',[['18:15:42',MB],['17:42:31',[{x:60,y:510,w:960,h:520}]],['11:08:05',[{x:405,y:2266,w:0,h:0},{x:60,y:1065,w:465,h:520}]]]],
    ['2026-09-23',[['19:04:21',[{x:860,y:22,w:170,h:56},{x:60,y:1620,w:960,h:520},{x:130,y:195,w:0,h:0}]],['15:30:10',[{x:50,y:322,w:980,h:156}]]]]
  ];
  let h=`<div class="win"><div class="bar">${lights()}<div class="title">History</div></div><div class="hist">`;
  days.forEach(([d,items],di)=>{
    h+=`<div class="day"><b>${d}</b><span class="pill">${items.length}</span></div><div class="grid">`;
    items.forEach(([t,m],ii)=>{
      const hov=di===0&&ii===1;
      h+=`<div class="hc ${hov?'hover':''}"><div class="th">${shot(BUG,m,null,120,'')}</div><div class="tm">${t}</div>${hov?`<div class="hb"><i>${ic('doc',13,1.8)}</i><i>${ic('folder',13,1.8)}</i></div>`:''}</div>`;
    });
    h+='</div>';
  });
  return h+'</div></div>';
}

function settings(){
  return `<div class="win"><div class="bar">${lights()}<div class="title">Settings</div></div>
    <div class="form">
      <div class="row"><span class="k">Workspace</span><span class="v">~/UIReview</span><div class="btn">Choose…</div></div>
      <div class="row"><span class="k">adb</span><span class="v gray">~/Library/Android/sdk/platform-tools/adb</span><span class="tag">Auto-detected</span><div class="btn">Choose…</div></div>
    </div>
    <p class="foot">Keep paths free of spaces — the export path is passed to Claude / Codex as a command argument.</p>
  </div>`;
}

const board=location.hash.slice(1)||'B';
const root=document.getElementById('root');
if(board==='C')document.body.classList.add('dark');
const views={
  A:()=>editor(false),
  B:()=>editor(true),
  C:()=>editor(true),
  D:()=>editor(true,menu()),
  E:()=>editor(true,sheet()),
  F:()=>editor(true,alertBox()),
  G:history,
  H:settings
};
root.innerHTML=views[board]();
</script>
